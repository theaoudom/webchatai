<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg)" rx="12"/>

  <!-- Radar Grid -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="180" r="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
  
  <!-- Overlay Scan Line (static representation) -->
  <path d="M200 180 L320 100" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path d="M200 180 L340 180" stroke="#38bdf8" stroke-width="20" opacity="0.1" />

  <!-- Ship silhouette -->
  <path d="M120 100 L280 100 L260 130 L140 130 Z" fill="#64748b" opacity="0.8"/>
  <rect x="160" y="80" width="40" height="20" fill="#475569" />
  <rect x="210" y="70" width="10" height="30" fill="#475569" />

  <!-- Hit markers -->
  <circle cx="150" cy="115" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="250" cy="115" r="8" fill="#ef4444" opacity="0.8"/>
  
  <!-- Crosshair -->
  <circle cx="200" cy="100" r="20" stroke="#ef4444" stroke-width="2" fill="none" />
  <line x1="180" y1="100" x2="220" y2="100" stroke="#ef4444" stroke-width="2" />
  <line x1="200" y1="80" x2="200" y2="120" stroke="#ef4444" stroke-width="2" />

  <!-- Title -->
  <text x="200" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#bae6fd" opacity="0.9" style="text-shadow: 0 0 10px #38bdf8;">BATTLESHIP</text>
  
  <!-- Decor -->
  <rect x="20" y="20" width="360" height="160" rx="8" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="10,5"/>

</svg>
